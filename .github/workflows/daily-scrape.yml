name: סריקה יומית של מוצרים
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - name: הורדת הקוד
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: התקנת Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: התקנת ספריות
        run: pip install requests beautifulsoup4

      - name: הפעלת הסריקה
        env:
          PYTHONUNBUFFERED: "1"
          SCRAPE_MAX_MINUTES: "25"
          SCRAPE_UPDATE_BATCH_SIZE: "250"
          SCRAPE_BATCH_SIZE: "500"
        run: python scrape_products.py

      - name: Verify source taxonomy and product membership
        run: python -u sync_source_taxonomy.py

      - name: Reject product identity drift before publication
        run: |
          python -m unittest test_stable_catalog test_source_taxonomy test_catalog_health
          python verify_catalog_health.py

      - name: שמירת המוצרים
        run: |
          git config user.name "אוטומציה"
          git config user.email "bot@masoret-yehudit.co.il"
          git add products.json categories.json progress.json all_urls.json source-categories.json missing-source-products.json catalog-audit.json
          git diff --staged --quiet || git commit -m "עדכון מוצרים אוטומטי"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Check catalog completeness after saving progress
        run: python verify_catalog_health.py --ready

  notify_waitlist:
    # Enable only after DASHBOARD_ORDERS_API_SECRET and RESEND_FROM are configured.
    if: ${{ vars.ENABLE_WAITLIST_EMAILS == 'true' }}
    runs-on: ubuntu-latest
    needs: scrape
    steps:
      - name: הורדת הקוד
        uses: actions/checkout@v4

      - name: התקנת Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: התקנת ספריות
        run: pip install requests

      - name: בדיקת חזרת מוצרים למלאי ושליחת מיילים
        env:
          DASHBOARD_ORDERS_API_SECRET: ${{ secrets.DASHBOARD_ORDERS_API_SECRET }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DASHBOARD_API_URL: https://masoret-dashboard.vercel.app
        run: python check_stock.py

  auto_orders:
    # Supplier ordering is deferred; catalog synchronization remains independent.
    if: ${{ vars.ENABLE_SUPPLIER_ORDERS == 'true' }}
    runs-on: ubuntu-latest
    needs: scrape
    steps:
      - name: הורדת הקוד
        uses: actions/checkout@v4

      - name: התקנת Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: התקנת ספריות
        run: |
          pip install requests playwright psycopg2-binary
          playwright install chromium
          playwright install-deps chromium

      - name: עיבוד הזמנות אוטומטי
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOURCE_EMAIL: ${{ secrets.SOURCE_EMAIL }}
          SOURCE_PASSWORD: ${{ secrets.SOURCE_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DASHBOARD_API_URL: https://masoret-dashboard.vercel.app
          OWNER_EMAIL: hatbaot2554@gmail.com
          AUTO_ORDER_SUBMIT: ${{ secrets.AUTO_ORDER_SUBMIT }}
        run: python auto_order.py
