name: Verify catalog synchronization
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-catalog-sync.yml'
      - 'verify_catalog_sync.py'
permissions:
  contents: write
concurrency:
  group: daily-scrape
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python verify_catalog_sync.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-sync-verification
          path: sync-verification.json
      - name: Publish verified products
        run: |
          python verify_catalog_health.py
          git config user.name 'Catalog verification'
          git config user.email 'bot@masoret-yehudit.co.il'
          git add products.json sync-verification.json
          git diff --staged --quiet || git commit -m 'Verify supplier catalog sample'
          git pull --rebase origin main
          git push origin HEAD:main
